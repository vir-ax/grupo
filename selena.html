<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofía Florencia Moreno</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 20, 0.4), rgba(0, 0, 30, 0.6)),
                        url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Noto Sans Mono', monospace;
            position: relative;
            color: white;
        }

        /* Contenedor de estrellas cayendo */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            color: #ff1744;
            font-size: 18px;
            text-shadow: 0 0 12px #ff1744,
                         0 0 24px #ff1744;
            animation: fall linear infinite;
            opacity: 0.85;
            user-select: none;
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-120px) rotate(0deg);
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* Contenido principal centrado */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 90%;
        }

        /* Círculo de la foto con glow blanco que respira */
        .profile-circle {
            width: 320px;
            height: 320px;
            margin: 0 auto 35px;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.7),
                        0 0 70px rgba(255, 255, 255, 0.45),
                        0 0 110px rgba(255, 255, 255, 0.25);
            animation: breathe 3.2s ease-in-out infinite alternate;
            transition: transform 0.3s ease;
        }

        .profile-circle:hover {
            transform: scale(1.05);
        }

        .profile-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Texto */
        .name {
            font-size: clamp(1.35rem, 4.5vw, 2.1rem);
            font-weight: 300;
            line-height: 1.3;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6),
                         0 0 15px rgba(255, 255, 255, 0.3);
            max-width: 620px;
            margin: 0 auto;
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .profile-circle {
                width: 260px;
                height: 260px;
            }
        }

        @media (max-width: 480px) {
            .profile-circle {
                width: 220px;
                height: 220px;
            }
        }

        /* Animación de respiración del glow */
        @keyframes breathe {
            from {
                box-shadow: 0 0 35px rgba(255, 255, 255, 0.7),
                            0 0 70px rgba(255, 255, 255, 0.45),
                            0 0 110px rgba(255, 255, 255, 0.25);
            }
            to {
                box-shadow: 0 0 55px rgba(255, 255, 255, 0.95),
                            0 0 95px rgba(255, 255, 255, 0.65),
                            0 0 140px rgba(255, 255, 255, 0.35);
            }
        }
    </style>
</head>
<body>
    <!-- Estrellas cayendo -->
    <div id="stars-container"></div>

    <!-- Contenido centrado -->
    <div class="content">
        <!-- Círculo con foto y glow blanco respirando -->
        <div class="profile-circle">
            <img src="sele.png" alt="Selena Mendez">
        </div>
        
        <!-- Texto -->
        <p class="name">
            MI NOMBRE ES SELENA MENDEZ,<br>
            TENGO 20 AÑOS Y VIVO EN BARRIO VICENTE SOLÁ
        </p>
    </div>

    <script>
        // Generar muchas estrellas rojas pequeñas cayendo
        function createStars() {
            const container = document.getElementById('stars-container');
            const numberOfStars = 110; // Muchas estrellas separadas

            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = '★';

                // Tamaño pequeño y variado
                const size = Math.random() * 19 + 11;
                star.style.fontSize = `${size}px`;

                // Posición horizontal aleatoria
                star.style.left = `${Math.random() * 100}vw`;

                // Duración de caída aleatoria (más rápido o lento)
                const duration = Math.random() * 4.5 + 4.2;
                star.style.animationDuration = `${duration}s`;

                // Retardo aleatorio para que no caigan todas juntas
                const delay = Math.random() * -12;
                star.style.animationDelay = `${delay}s`;

                // Opacidad variada
                star.style.opacity = Math.random() * 0.55 + 0.55;

                container.appendChild(star);
            }
        }

        // Iniciar estrellas cuando cargue la página
        window.addEventListener('load', createStars);
    </script>
</body>
</html>
